<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">    <title>Invitación Digital - Andrés Cumple 6</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lilita+One&family=Luckiest+Guy&display=swap" rel="stylesheet">
</head>
<body>
    <audio id="audio-invitacion" src="sound/musica.mp3" loop></audio>
    <div class="contenedor-invitacion">
        <div class="pantalla pantalla-uno">
            <div class="reproductor-musica">
                <div class="linea-progreso" id="barra-progreso">
                    <div class="progreso-actual"></div>
                    <div class="manejador-progreso"></div>
                </div>
                <button class="boton-control" id="control-play-pause">
                    <svg id="icono-play" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="icono-pausa" viewBox="0 0 24 24" style="display: none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="pantalla pantalla-dos">
            <a href="https://maps.app.goo.gl/oNYKXNYrthd5UGxc8" target="_blank" class="boton-interactivo" id="boton-ubicacion">VER UBICACION</a>
            <button class="boton-interactivo" id="boton-confirmar">CONFIRMAR ASISTENCIA</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
